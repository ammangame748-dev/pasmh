<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS System | Status</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .status-dot {
            height: 15px;
            width: 15px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
            box-shadow: 0 0 10px #2ecc71;
        }
        h1 { margin-bottom: 10px; }
        p { color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BS System <span class="status-dot"></span></h1>
        <p>البوت متصل حالياً ويعمل بنجاح على Render.</p>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        <p style="font-size: 0.8rem;">Developed with ❤️ by BS Team</p>
    </div>
</body>
</html>
